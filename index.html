<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>McDonald's · Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="main-header sticky-top">
        <nav class="container d-flex justify-content-between align-items-center py-3">
            <a href="#" class="brand text-decoration-none d-flex align-items-center gap-3">
                <span class="brand-symbol">M</span>
                <span>
                    <strong class="d-block">McDonald's</strong>
                    <small>Pedido para retirar</small>
                </span>
            </a>

            <button id="btnIrCarrito" class="btn btn-light position-relative" type="button">
                Mi pedido
                <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-warning">0</span>
            </button>
        </nav>
    </header>

    <main class="container py-4 py-lg-5">
        <div class="row g-4">
            <section class="col-lg-8" aria-labelledby="tituloMenu">
                <div class="mb-4">
                    <h1 id="tituloMenu" class="h2 fw-bold mb-2">Elegí tus productos</h1>
                    <p class="text-secondary mb-0">Seleccioná los artículos que quieras agregar al pedido.</p>
                </div>

                <div id="filtros" class="filter-bar d-flex flex-wrap gap-2 mb-4">
                    <button class="btn btn-category active" data-categoria="todos" type="button">Todos</button>
                    <button class="btn btn-category" data-categoria="Hamburguesas" type="button">Hamburguesas</button>
                    <button class="btn btn-category" data-categoria="Acompañamientos" type="button">Papas</button>
                    <button class="btn btn-category" data-categoria="Bebidas" type="button">Refrescos</button>
                </div>

                <div id="productos" class="row g-3"></div>
            </section>

            <aside class="col-lg-4" aria-labelledby="tituloCarrito">
                <div id="carritoPanel" class="cart-panel">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3">
                        <div>
                            <span class="section-label">RESUMEN</span>
                            <h2 id="tituloCarrito" class="h4 mb-0">Mi pedido</h2>
                        </div>
                        <button id="btnVaciar" class="btn btn-sm btn-link text-secondary text-decoration-none" type="button">Vaciar</button>
                    </div>

                    <div id="mensaje" class="alert mt-3 mb-0 d-none" role="status"></div>
                    <div id="carrito" class="py-2"></div>

                    <div class="border-top pt-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Total</strong>
                            <strong id="totalCarrito" class="fs-4">$ 0</strong>
                        </div>
                        <button id="btnConfirmar" class="btn btn-warning w-100 fw-bold py-2" type="button">Confirmar pedido</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="modalProductoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h2 class="modal-title h5" id="modalProductoTitulo">Detalle del producto</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row align-items-center g-3">
                        <div class="col-4">
                            <img id="modalProductoImagen" class="modal-product-image" src="" alt="">
                        </div>
                        <div class="col-8">
                            <span id="modalProductoCategoria" class="section-label"></span>
                            <h3 id="modalProductoNombre" class="h4 mt-1"></h3>
                            <p id="modalProductoDescripcion" class="text-secondary small"></p>
                            <strong id="modalProductoPrecio" class="fs-5"></strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
